spring.application.name=sweet-shop

server.port=8081

# Database Configuration
# Default: H2 (works immediately, no setup needed)
# For MySQL: Use profile 'mysql' or update these values
spring.datasource.url=jdbc:h2:mem:sweetshop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for viewing data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=your-256-bit-secret-key-for-sweet-shop-management-system-2024-production-ready
jwt.expiration=86400000
