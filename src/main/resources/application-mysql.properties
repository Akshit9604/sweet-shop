spring.application.name=sweet-shop

server.port=8081

# MySQL Database Configuration
# Update these values with your MySQL credentials
# Or use environment variables: DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/sweetshop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway since we're using Hibernate DDL auto-update
spring.flyway.enabled=false


