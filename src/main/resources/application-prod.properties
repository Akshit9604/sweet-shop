spring.application.name=sweet-shop

# Use PORT environment variable (for cloud platforms)
server.port=${PORT:8081}

# Database Configuration
# Default to H2 for easier deployment - app will start immediately
# To use MySQL: Set SPRING_DATASOURCE_URL or ensure MYSQL_HOST is set via Railway database reference

# Default: H2 (works immediately, no setup needed)
spring.datasource.url=jdbc:h2:mem:sweetshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Override with MySQL if SPRING_DATASOURCE_URL is set
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sweetshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}

# Or use DATABASE_URL if set
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:sweetshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}

# Or build from Railway MYSQL_* variables if MYSQL_HOST is set
spring.datasource.url=${MYSQL_HOST:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:sweetshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}}
spring.datasource.url=${MYSQL_HOST:+jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:railway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=3&initialTimeout=2&connectTimeout=5000&socketTimeout=5000&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true}${MYSQL_HOST:jdbc:h2:mem:sweetshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MYSQL_USER:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}}
spring.datasource.password=${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}}
spring.datasource.driver-class-name=${MYSQL_HOST:+com.mysql.cj.jdbc.Driver}${MYSQL_HOST:org.h2.Driver}

# Connection pool settings
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${MYSQL_HOST:+org.hibernate.dialect.MySQLDialect}${MYSQL_HOST:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.connection.initialization_fail_timeout=5000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 Console (enabled for H2, useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sweetshop=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-sweet-shop-management-system-2024-production-ready}
jwt.expiration=${JWT_EXPIRATION:86400000}
