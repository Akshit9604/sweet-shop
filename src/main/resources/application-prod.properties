spring.application.name=sweet-shop

# Use PORT environment variable (for cloud platforms)
server.port=${PORT:8081}

# Production database configuration
# Supports multiple formats: Railway, Render, Heroku, etc.
# Railway format: MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
# Standard format: DATABASE_URL or SPRING_DATASOURCE_URL
# Individual variables: DB_USERNAME, DB_PASSWORD, etc.

# Railway MySQL connection configuration
# Railway provides: MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
# Priority: SPRING_DATASOURCE_URL > DATABASE_URL > Railway MYSQL_* variables > H2 fallback

# Try SPRING_DATASOURCE_URL first (if explicitly set)
# Then try DATABASE_URL (standard format)
# Then try Railway format: jdbc:mysql://MYSQL_HOST:MYSQL_PORT/MYSQL_DATABASE
# Fallback to H2 if no MySQL variables are set
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sweetshop}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2&connectTimeout=30000&socketTimeout=60000&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings for Railway
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Wait for database to be ready (important for Railway)
# Increase timeout for Railway database initialization (2 minutes)
spring.jpa.properties.hibernate.connection.initialization_fail_timeout=120000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable H2 console in production
spring.h2.console.enabled=false

# Disable Flyway
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sweetshop=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

