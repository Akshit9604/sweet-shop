spring.application.name=sweet-shop

# Use PORT environment variable (for Railway)
server.port=${PORT:8081}

# Railway MySQL Database Configuration
# If MYSQL_HOST is not set, this will fail - but we'll handle it gracefully
# Default to H2 if MySQL connection fails (see DatabaseConfig.java)

# Try MySQL connection (will use H2 if MYSQL_HOST is not set via DatabaseConfig)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:railway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=3&initialTimeout=2&connectTimeout=5000&socketTimeout=5000&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=1

# JPA Configuration - Will switch to H2 dialect if MySQL fails (see DatabaseConfig.java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Wait for database to be ready (shorter timeout for faster fallback)
spring.jpa.properties.hibernate.connection.initialization_fail_timeout=10000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 Console (enabled if using H2 fallback)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sweetshop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-sweet-shop-management-system-2024-production-ready}
jwt.expiration=${JWT_EXPIRATION:86400000}
