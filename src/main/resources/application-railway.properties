spring.application.name=sweet-shop

# Use PORT environment variable (for Railway)
server.port=${PORT:8081}

# Railway MySQL Database Configuration
# Railway automatically provides these variables when database reference is added:
# MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD

# Build MySQL connection URL from Railway variables
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:railway}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2&connectTimeout=30000&socketTimeout=60000&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings optimized for Railway
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Wait longer for database to be ready (Railway databases can take time to initialize)
spring.jpa.properties.hibernate.connection.initialization_fail_timeout=120000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Disable Flyway
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sweetshop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-sweet-shop-management-system-2024-production-ready}
jwt.expiration=${JWT_EXPIRATION:86400000}

